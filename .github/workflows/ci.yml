name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Server unit tests and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspace server
      - name: Unit tests (end-to-end tests skip without a server)
        run: npm test --workspace server
      - name: Type check
        run: npm run check-types --workspace server

  storefront:
    name: Storefront tests, types and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspace storefront
      - run: npm test --workspace storefront
      - run: npm run lint --workspace storefront
      - run: npm run check-types --workspace storefront
      - name: Upgrade notes and release manifests
        run: npm run upgrade:validate --workspace storefront

  e2e:
    name: End-to-end tests on a fresh database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vendure
          POSTGRES_USER: vendure
          # Only reachable from this job, and discarded with it.
          POSTGRES_PASSWORD: ci-throwaway-db-password
        ports:
          - 5432:5432
        # The job's steps start only once this reports healthy.
        options: >-
          --health-cmd "pg_isready -U vendure -d vendure"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      mailpit:
        # SMTP sink for the emails the worker sends, such as order confirmations.
        image: axllent/mailpit:v1.29.7
        ports:
          - 1025:1025
    env:
      # Anything but "dev" applies the production configuration checks.
      APP_ENV: ci
      VENDURE_SERVER_PORT: '3002'
      SUPERADMIN_USERNAME: ci-superadmin
      CORS_ORIGINS: http://localhost:3003
      STOREFRONT_URL: http://localhost:3003
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      EMAIL_FROM: '"Commerce OS CI" <ci@example.com>'
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: vendure
      DB_USERNAME: vendure
      DB_PASSWORD: ci-throwaway-db-password
      DB_SCHEMA: public
      E2E_SERVER_URL: http://localhost:3002
      E2E_ADMIN_USERNAME: ci-superadmin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspace server
      - name: Generate throwaway credentials
        run: |
          password="$(openssl rand -hex 24)"
          cookie_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "::add-mask::$cookie_secret"
          {
            echo "SUPERADMIN_PASSWORD=$password"
            echo "E2E_ADMIN_PASSWORD=$password"
            echo "COOKIE_SECRET=$cookie_secret"
          } >> "$GITHUB_ENV"
      - name: Compile the server and worker
        run: npm run build:server --workspace server
      - name: Migrate, start, seed and run the end-to-end tests
        run: npm run test:e2e --workspace server
        env:
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs
